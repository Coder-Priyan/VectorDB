name: VectorDB CI

on:
  push:
    branches: [ main, ui-redesign ]
  pull_request:
    branches: [ main ]

jobs:
  windows-build:
    name: Windows Build & Test (UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VectorDB
        run: |
          cmake --build build

      - name: Run Test Suite
        run: |
          ./build/vectordb_tests.exe

      - name: Run Web Safety Scanner
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/check_web_safety.ps1

  linux-build:
    name: Ubuntu Build & Test (Linux)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VectorDB
        run: |
          cmake --build build

      - name: Run Test Suite
        run: |
          ./build/vectordb_tests

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t vectordb .

      - name: Smoke test container
        run: |
          # Cleanup helper: always print logs and remove container at the end, even on failure
          cleanup() {
            echo "=== Container logs (vdb) ==="
            docker logs vdb || true
            echo "=== Removing container (vdb) ==="
            docker rm -f vdb || true
          }
          trap cleanup EXIT

          # a. Start container in background with loopback publish only
          docker run -d --name vdb -p 127.0.0.1:8080:8080 vectordb

          # b. Wait for readiness by retrying curl up to 30 seconds
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "VectorDB container failed to become ready within 30 seconds"
            exit 1
          fi

          # c. Root web UI must succeed
          curl -sf http://127.0.0.1:8080/ > /dev/null

          # d. Health API must succeed
          curl -sf http://127.0.0.1:8080/api/health

