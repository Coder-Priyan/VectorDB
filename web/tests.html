<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';">
  <title>VectorDB Browser Unit Tests</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* Safe styling via linked sheet and fallback scoped styles */
    .test-suite { margin-bottom: 1.5rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem; }
    .test-case { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
    .test-case:last-child { border-bottom: none; }
    .test-name { font-family: var(--font-mono); }
    .test-summary { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: var(--radius-md); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <h1 class="app-title">VectorDB Unit Tests</h1>
      <span class="app-subtitle">Browser Suite for Pure Logic Modules</span>
    </div>
    <div class="header-controls">
      <a href="index.html" class="btn btn-sm btn-outline">Back to UI</a>
      <button id="run-again-btn" class="btn btn-sm btn-primary">Run Tests</button>
    </div>
  </header>

  <main class="app-content">
    <div id="test-summary-box" class="test-summary alert alert-danger hidden">
      Running test suites...
    </div>
    <div id="test-results-container"></div>
  </main>

  <script type="module" src="js/tests/all_tests.js"></script>
</body>
</html>
